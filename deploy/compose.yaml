services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?defina NVIDIA_API_KEY no ambiente}
      FLEET_API_TOKEN: ${FLEET_API_TOKEN:?defina FLEET_API_TOKEN no ambiente}
      MODELO_PLANEJADOR: ${MODELO_PLANEJADOR:-gpt-oss:20b}
      FLAGS_GPU: ${FLAGS_GPU:---gpu t4}
      FLEET_CORS_ALLOWED_ORIGINS: ${FLEET_CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ..:/opt/fleet/repo:ro
      - fleet-runs:/var/lib/fleet/runs
      - colab-home:/home/fleet
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  panel:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    environment:
      PANEL_ADDRESS: ${PANEL_ADDRESS:-:80}
    ports:
      - "${PANEL_HTTP_PORT:-8080}:80"
      - "${PANEL_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  fleet-runs:
  colab-home:
  caddy-data:
  caddy-config:
