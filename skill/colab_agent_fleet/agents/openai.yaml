# OpenClaw agent config for Colab Agent Fleet execution lane
# Used by: openclaw agent exec --config agents/openai.yaml ...

model: "nvidia/nemotron-3.5-lightning-30b-a3b"
provider: "nvidia"
temperature: 0.2
max_tokens: 4096

# Tool configuration
tools:
  - name: "web_search"
    description: "Search the web via DuckDuckGo and return structured results"
    # Plugin provides this tool; no extra config needed

# Execution settings
execution:
  mode: "local"          # embedded agent (fast, no gateway round-trip for tools)
  lean: true             # --local-model-lean reduced tool surface
  timeout_seconds: 1800  # 30 min per task

# Provider auth (set via env at runtime)
# NVIDIA_API_KEY injected via: echo $NVIDIA_API_KEY | openclaw models auth paste-api-key --provider nvidia

# Logging
log_level: "info"

# Automation / Debug mode
# When enabled: skips TUI, uses mock_prompt below, runs in terminal with full logs
automation:
  enabled: false
  mock_prompt: "Use browser para navegar até https://example.com, tire um snapshot da página, faça um screenshot e descreva em português o que você vê na tela."
  timeout_minutes: 120  # máximo 2 horas para debug

# Browser tool (Chromium/Playwright) nos executores
# Se true: instala Chromium e habilita browser tool (login, screenshots, JS, cliques)
# Se false: usa apenas web_search (DuckDuckGo) — mais leve
browser:
  enabled: true
  # Quando usar browser vs web_search:
  # - web_search: fatos públicos, múltiplas fontes, rápido
  # - browser: login, formulários, JS pesado, screenshots, cliques
  profile: "full"  # tool profile do OpenClaw