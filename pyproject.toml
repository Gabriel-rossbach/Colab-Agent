[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-agent-fleet"
version = "0.1.0"
description = "Distributed web research fleet: GPU planner + CPU execution lane on Colab"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Seu Nome", email = "seu@email.com"}
]
maintainers = [
    {name = "Seu Nome", email = "seu@email.com"}
]
keywords = [
    "openclaw", "colab", "distributed", "research", "web-search", "multi-agent"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "textual>=0.50",
    "colab-cli>=0.1",
    "duckduckgo-search>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
planner = [
    "ollama>=0.3",
]

[project.entry-points]
"colab-fleet-plan" = "colab_agent_fleet.scripts.init_fleet_plan:main"
"colab-fleet-run" = "colab_agent_fleet.scripts.run_fleet:main"
"colab-fleet-validate" = "colab_agent_fleet.scripts.validate_fleet_plan:main"
"colab-fleet-summary" = "colab_agent_fleet.scripts.render_fleet_summary:main"
"colab-fleet-context" = "colab_agent_fleet.scripts.capture_fleet_context:main"
"colab-fleet-dashboard" = "colab_agent_fleet.dashboard:main"

[tool.setuptools.packages.find]
where = ["skill"]
include = ["colab_agent_fleet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers"
markers = [
    "integration: marks tests requiring Colab infrastructure",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.py$"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "PTH"]
ignore = ["E501", "B008"]
fixable = ["ALL"]
unsafe-fixes = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true